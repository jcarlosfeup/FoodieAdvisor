name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_USER: foodie
          POSTGRES_PASSWORD: foodie_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodie -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests create and drop their own temporary database on this server.
      TEST_DATABASE_URL: postgresql+psycopg://foodie:foodie_ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - name: dbt deps (also used by the API end-to-end tests)
        working-directory: transformations/dbt
        run: uv run dbt deps --profiles-dir .
        env:
          POSTGRES_USER: foodie
          POSTGRES_PASSWORD: foodie_ci
          POSTGRES_DB: postgres
      - run: uv run pytest -q
      - name: Apply db/init bootstrap SQL
        env:
          PGPASSWORD: foodie_ci
        run: for f in db/init/*.sql; do psql -v ON_ERROR_STOP=1 -h localhost -U foodie -d postgres -f "$f"; done
      - name: dbt build (models, data tests and unit tests on empty raw tables)
        working-directory: transformations/dbt
        env:
          POSTGRES_USER: foodie
          POSTGRES_PASSWORD: foodie_ci
          POSTGRES_DB: postgres
          POSTGRES_PORT: "5432"
        run: uv run dbt build --profiles-dir .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
