[project]
name = "foodie-advisor"
version = "0.2.0"
description = "FoodieAdvisor monorepo workspace root"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "foodie-common",
    "foodie-collector",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "collector"]

[tool.uv.sources]
foodie-common = { workspace = true }
foodie-collector = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/foodie_common/tests", "collector/tests"]
addopts = "--import-mode=importlib"
markers = ["integration: needs TEST_DATABASE_URL pointing at a disposable PostGIS server"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["foodie_common", "foodie_collector"]
