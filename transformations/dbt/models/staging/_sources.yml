version: 2

sources:
  - name: raw
    description: Landing tables written by the foodie-collect jobs (db/init/02_raw_tables.sql).
    schema: raw
    tables:
      - name: ingestion_runs
        description: One row per collection run, with status, counts and parameters.
      - name: osm_restaurants
        description: Traditional restaurants from OpenStreetMap via Overpass (© OpenStreetMap contributors, ODbL).
        config:
          loaded_at_field: _last_seen_at
          freshness:
            warn_after: { count: 14, period: day }
            error_after: { count: 45, period: day }
      - name: geonames_cities
        description: GeoNames cities5000 (© GeoNames, CC BY 4.0).
      - name: geonames_countries
        description: GeoNames countryInfo.txt (© GeoNames, CC BY 4.0).
